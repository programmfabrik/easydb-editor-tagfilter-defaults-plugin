plugin:
  name: easydb-editor-tagfilter-defaults-plugin
  url: https://github.com/programmfabrik/easydb-editor-tagfilter-defaults-plugin
  displayname:
    en-US: "Default Values Plugin"
    de-DE: "Standardwerte Plugin"
  info:
    de-DE: |
      Setzt im Editor einfache Standardwerte für Textfelder abhängig vom aktiven Tag-Filter. Nützlich, wenn je nach Tag unterschiedliche Vorgabewerte vorbelegt werden sollen, damit Anwender nicht bei jedem Datensatz dieselben Werte eintippen müssen. Reines Frontend-Plugin für [easydb5](https://docs.easydb.de/en/sysadmin/configuration/easydb-server.yml/plugins/tagfilter/) und [fylr](https://docs.fylr.io/plugins/overview).
    en-US: |
      Sets simple text-field defaults in the editor based on the active tag filter. Useful when different tags should pre-fill different default values, so users start from the right baseline instead of typing the same values on every record. This is a frontend-only plugin and works in both [easydb5](https://docs.easydb.de/en/sysadmin/configuration/easydb-server.yml/plugins/tagfilter/) and [fylr](https://docs.fylr.io/plugins/overview).
  version: 1.2
  vendor: Programmfabrik GmbH
  server:
    api-version:
      require: 1
  webfrontend:
    url: editor-tagfilter-defaults.js
    l10n: l10n
  l10n: l10n/editor-tagfilter-defaults.csv # l10n csv file for fylr

base_config:
  - name: editor-tagfilter-defaults
    group: editor
    parameters:
      filters:
        type: table
        fields:
          - name: "operation"
            type: string-list
            label_choice: "operation"
            choices:
              - update
              - insert
            position: 0
          - name: "mask_id"
            type: "int"
            plugin_type: "mask-select"
            position: 1
          - name: "pool_id"
            type: "text"
            store_as_json: true
            plugin_type: "pool-select"
            position: 2
          - name: "tagfilter"
            type: "text"
            store_as_json: true
            plugin_type: "tag-filter"
            position: 3
          - name: "default"
            type: "text"
            store_as_json: true
            plugin_type: "column-default-value"
            position: 4
        position: 0
